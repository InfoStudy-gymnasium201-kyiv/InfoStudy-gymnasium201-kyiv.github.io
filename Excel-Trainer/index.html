<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Майстер</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Анімації */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-gray-800 min-h-screen flex flex-col items-center">

    <!-- Основний контейнер програми -->
    <div id="app" class="w-full max-w-4xl p-4 flex-1 flex flex-col justify-center">
        <!-- Вміст буде рендеритися сюди через JS -->
    </div>

    <script>
        // --- Дані (Рівні) ---
        const levels = [
            {
                id: 1,
                title: "Основи множення",
                description: "Нам потрібно порахувати загальну вартість квитків до Львова (Ціна × Кількість). Яку формулу вставити в комірку D2?",
                headers: ["A", "B", "C", "D"],
                tableData: [
                    ["Напрямок", "Ціна (грн)", "Продано", "Сума"],
                    ["Львів", "450", "10", "?"],
                    ["Київ", "600", "5", "3000"],
                    ["Одеса", "550", "8", "4400"],
                ],
                targetCell: { row: 1, col: 3, displayId: "D2" },
                options: [
                    { id: "A", text: "=B2+C2" },
                    { id: "B", text: "=B2*C2" },
                    { id: "C", text: "=SUM(B2:C2)" },
                ],
                correctOptionId: "B",
                explanation: "Щоб знайти загальну суму, потрібно помножити ціну однієї одиниці (B2) на кількість (C2). Знак множення в Excel — це зірочка (*).",
                resultValue: "4500"
            },
            {
                id: 2,
                title: "Функція SUM (Сума)",
                description: "Тепер нам потрібно дізнатися, скільки всього квитків було продано на всі напрямки. Яка формула підійде для комірки C5?",
                headers: ["A", "B", "C", "D"],
                tableData: [
                    ["Напрямок", "Ціна", "Продано", "Сума"],
                    ["Львів", "450", "10", "4500"],
                    ["Київ", "600", "5", "3000"],
                    ["Одеса", "550", "8", "4400"],
                    ["Всього", "", "?", "11900"],
                ],
                targetCell: { row: 4, col: 2, displayId: "C5" },
                options: [
                    { id: "A", text: "=SUM(C2:C4)" },
                    { id: "B", text: "=C2+C3" },
                    { id: "C", text: "=COUNT(C2:C4)" },
                ],
                correctOptionId: "A",
                explanation: "Функція SUM додає всі числа в заданому діапазоні. C2:C4 охоплює всі продані квитки.",
                resultValue: "23"
            },
            {
                id: 3,
                title: "Середнє значення (AVERAGE)",
                description: "Керівництво хоче знати середню ціну квитка серед усіх наших маршрутів. Заповніть комірку B5.",
                headers: ["A", "B", "C", "D"],
                tableData: [
                    ["Напрямок", "Ціна", "Продано", "Сума"],
                    ["Львів", "450", "10", "4500"],
                    ["Київ", "600", "5", "3000"],
                    ["Одеса", "550", "8", "4400"],
                    ["Середня", "?", "", ""],
                ],
                targetCell: { row: 4, col: 1, displayId: "B5" },
                options: [
                    { id: "A", text: "=MIDDLE(B2:B4)" },
                    { id: "B", text: "=AVERAGE(B2:B4)" },
                    { id: "C", text: "=SUM(B2:B4)/2" },
                ],
                correctOptionId: "B",
                explanation: "AVERAGE — це стандартна функція для обчислення середнього арифметичного чисел у діапазоні.",
                resultValue: "533.33"
            },
            {
                id: 4,
                title: "Максимальне значення (MAX)",
                description: "Який напрямок приніс найбільше грошей? Знайдіть максимальну суму в стовпчику D.",
                headers: ["A", "B", "C", "D"],
                tableData: [
                    ["Напрямок", "Ціна", "Продано", "Сума"],
                    ["Львів", "450", "10", "4500"],
                    ["Київ", "600", "5", "3000"],
                    ["Одеса", "550", "8", "4400"],
                    ["Максимум", "", "", "?"],
                ],
                targetCell: { row: 4, col: 3, displayId: "D5" },
                options: [
                    { id: "A", text: "=MAX(D2:D4)" },
                    { id: "B", text: "=HIGH(D2:D4)" },
                    { id: "C", text: "=TOP(D2:D4)" },
                ],
                correctOptionId: "A",
                explanation: "Функція MAX повертає найбільше число з вибраного набору даних (діапазону D2:D4).",
                resultValue: "4500"
            },
            {
                id: 5,
                title: "Умова (IF)",
                description: "Якщо продано більше 8 квитків, статус має бути 'Популярний', інакше 'Звичайний'. Яка формула для E2?",
                headers: ["A", "B", "C", "D", "E"],
                tableData: [
                    ["Напрямок", "Ціна", "Продано", "Сума", "Статус"],
                    ["Львів", "450", "10", "4500", "?"],
                    ["Київ", "600", "5", "3000", "Звичайний"],
                    ["Одеса", "550", "8", "4400", "Звичайний"],
                ],
                targetCell: { row: 1, col: 4, displayId: "E2" },
                options: [
                    { id: "A", text: "=IF(C2>8; 'Популярний'; 'Звичайний')" },
                    { id: "B", text: "=CHECK(C2>8; 'Популярний')" },
                    { id: "C", text: "=IF(C2<8; 'Популярний'; 'Звичайний')" },
                ],
                correctOptionId: "A",
                explanation: "Функція IF (ЯКЩО) перевіряє умову. Перший аргумент — умова (C2>8), другий — якщо істина, третій — якщо хибність.",
                resultValue: "Популярний"
            }
        ];

        // --- Стан гри (State) ---
        let state = {
            screen: 'intro', // 'intro', 'playing', 'feedback', 'finished'
            currentLevelIndex: 0,
            score: 0,
            selectedOptionId: null,
            isCorrect: false
        };

        const appContainer = document.getElementById('app');

        // --- Функції рендеру (View) ---

        function render() {
            appContainer.innerHTML = ''; // Очищення

            if (state.screen === 'intro') {
                renderIntro();
            } else if (state.screen === 'playing' || state.screen === 'feedback') {
                renderGame();
            } else if (state.screen === 'finished') {
                renderFinished();
            }

            // Ініціалізація іконок Lucide після оновлення DOM
            lucide.createIcons();
        }

        function renderIntro() {
            const html = `
                <div class="max-w-2xl w-full mx-auto bg-white rounded-xl shadow-2xl overflow-hidden animate-fade-in">
                    <div class="bg-green-600 p-8 text-center">
                        <i data-lucide="calculator" class="w-16 h-16 text-white mx-auto mb-4"></i>
                        <h1 class="text-4xl font-bold text-white mb-2">Excel Майстер</h1>
                        <p class="text-green-100 text-lg">Вивчи формули граючи!</p>
                    </div>
                    <div class="p-8 text-center space-y-6">
                        <p class="text-gray-600 text-lg">
                            Ласкаво просимо в симулятор таблиць. Вам потрібно допомогти аналітику заповнити пропущені формули в звітах про залізничні перевезення.
                        </p>
                        <div class="flex justify-center gap-8 text-left text-sm text-gray-500 bg-gray-50 p-4 rounded-lg">
                            <div>
                                <span class="font-bold block text-gray-700">🎯 Ціль:</span>
                                Обрати правильну формулу
                            </div>
                            <div>
                                <span class="font-bold block text-gray-700">📊 Рівні:</span>
                                ${levels.length} практичних завдань
                            </div>
                        </div>
                        <button onclick="startGame()" class="inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-full text-xl transition-all transform hover:scale-105">
                            <i data-lucide="play" class="w-6 h-6"></i> Почати гру
                        </button>
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function renderFinished() {
            let message = state.score === levels.length ? "Ідеально! Ви справжній експерт Excel." : "Чудовий початок! Спробуйте ще раз.";
            
            const html = `
                <div class="max-w-md w-full mx-auto bg-white rounded-xl shadow-2xl overflow-hidden text-center p-8 animate-fade-in">
                    <i data-lucide="trophy" class="w-20 h-20 text-yellow-500 mx-auto mb-6"></i>
                    <h2 class="text-3xl font-bold text-gray-800 mb-2">Гру завершено!</h2>
                    <p class="text-gray-600 mb-6">Ваш результат:</p>
                    
                    <div class="text-6xl font-black text-green-600 mb-2">${state.score} / ${levels.length}</div>
                    <p class="text-sm text-gray-500 mb-8">${message}</p>

                    <button onclick="startGame()" class="w-full inline-flex justify-center items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i> Грати знову
                    </button>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function renderGame() {
            const level = levels[state.currentLevelIndex];
            const isFeedback = state.screen === 'feedback';
            
            // Визначаємо текст формули для рядка fx
            let fxText = '';
            if (isFeedback && state.isCorrect) {
                 const correctOpt = level.options.find(o => o.id === level.correctOptionId);
                 fxText = correctOpt ? correctOpt.text : '';
            }

            // --- Генерація Таблиці ---
            let tableHeaderHtml = '<tr><th class="w-10 bg-gray-100 border border-gray-300 text-gray-500 font-normal"></th>';
            level.headers.forEach(h => {
                tableHeaderHtml += `<th class="bg-gray-100 border border-gray-300 px-4 py-2 text-gray-700 font-semibold w-24">${h}</th>`;
            });
            tableHeaderHtml += '</tr>';

            let tableBodyHtml = '';
            level.tableData.forEach((row, rowIndex) => {
                tableBodyHtml += '<tr>';
                // Номер рядка
                tableBodyHtml += `<td class="bg-gray-100 border border-gray-300 text-center text-gray-500 font-normal">${rowIndex + 1}</td>`;
                
                // Комірки даних
                row.forEach((cellContent, colIndex) => {
                    const isTarget = rowIndex === level.targetCell.row && colIndex === level.targetCell.col;
                    let content = cellContent;
                    let cellClasses = "border border-gray-300 px-4 py-2 text-right relative ";
                    
                    if (colIndex === 0) cellClasses += "text-left ";
                    
                    if (isTarget) {
                        cellClasses += "bg-yellow-100 ring-2 ring-inset ring-green-500 font-bold text-blue-600 ";
                        // Якщо правильна відповідь - показуємо результат, інакше ?
                        if (isFeedback && state.isCorrect) {
                            content = level.resultValue;
                        } else {
                            content = "?";
                        }
                    } else {
                        cellClasses += "bg-white text-gray-800 ";
                    }

                    let labelHtml = '';
                    if (isTarget) {
                         labelHtml = `<div class="absolute -top-3 -right-3 bg-green-500 text-white text-[10px] px-1 rounded shadow animate-bounce">${level.targetCell.displayId}</div>`;
                    }

                    tableBodyHtml += `<td class="${cellClasses}">${content}${labelHtml}</td>`;
                });
                tableBodyHtml += '</tr>';
            });

            // --- Генерація Опцій ---
            let optionsHtml = '';
            level.options.forEach(opt => {
                let btnClass = "w-full p-4 rounded-lg text-left transition-all duration-200 font-mono text-sm shadow-sm border-2 ";
                
                if (isFeedback) {
                    if (opt.id === level.correctOptionId) {
                        btnClass += "bg-green-100 border-green-500 text-green-800";
                    } else if (opt.id === state.selectedOptionId) {
                        btnClass += "bg-red-100 border-red-500 text-red-800 opacity-50";
                    } else {
                        btnClass += "bg-gray-50 border-gray-200 text-gray-400 cursor-not-allowed";
                    }
                } else {
                    btnClass += "bg-white border-gray-200 hover:border-blue-400 text-gray-700";
                }

                const disabledAttr = isFeedback ? 'disabled' : '';
                const clickHandler = isFeedback ? '' : `onclick="handleOptionClick('${opt.id}')"`;

                optionsHtml += `
                    <button ${disabledAttr} ${clickHandler} class="${btnClass}">
                        <span class="font-bold mr-2 opacity-50">${opt.id}.</span> ${opt.text}
                    </button>
                `;
            });

            // --- Блок Фідбеку ---
            let feedbackHtml = '';
            if (isFeedback) {
                const bgClass = state.isCorrect ? 'bg-green-600 text-white' : 'bg-red-500 text-white';
                const iconName = state.isCorrect ? 'check-circle' : 'x-circle';
                const title = state.isCorrect ? 'Правильно!' : 'Не зовсім...';
                const btnText = state.currentLevelIndex < levels.length - 1 ? "Наступний рівень" : "Завершити гру";

                feedbackHtml = `
                    <div class="rounded-xl p-6 shadow-md animate-fade-in ${bgClass} mt-4">
                        <div class="flex items-center gap-3 mb-3">
                            <i data-lucide="${iconName}" class="w-7 h-7"></i>
                            <h3 class="text-xl font-bold">${title}</h3>
                        </div>
                        <p class="text-sm opacity-90 mb-6 leading-relaxed">
                            ${state.isCorrect ? level.explanation : "Спробуйте ще раз або перейдіть до наступного рівня."}
                        </p>
                        <button onclick="nextLevel()" class="w-full bg-white text-gray-900 font-bold py-3 px-4 rounded-lg hover:bg-opacity-90 transition-all flex items-center justify-center gap-2">
                            ${btnText} <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
            }

            // --- Збірка основного HTML ---
            const html = `
                <!-- Header -->
                <div class="bg-white rounded-lg shadow-sm p-4 flex justify-between items-center mb-6">
                    <div class="flex items-center gap-2">
                        <div class="bg-green-100 p-2 rounded-lg">
                            <i data-lucide="calculator" class="text-green-600 w-6 h-6"></i>
                        </div>
                        <span class="font-bold text-gray-700">Excel Тренажер</span>
                    </div>
                    <div class="flex items-center gap-6">
                        <div class="text-sm text-gray-500">Рівень ${state.currentLevelIndex + 1} з ${levels.length}</div>
                        <div class="bg-green-600 text-white px-4 py-1 rounded-full font-bold text-sm">
                            Рахунок: ${state.score}
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fade-in">
                    <!-- Left Column -->
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Instructions -->
                        <div class="bg-white rounded-xl p-6 shadow-sm border-l-4 border-blue-500">
                            <h2 class="text-xl font-bold text-gray-800 mb-2">${level.title}</h2>
                            <p class="text-gray-600 leading-relaxed">${level.description}</p>
                        </div>

                        <!-- Excel Simulator -->
                        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-300">
                            <!-- Toolbar -->
                            <div class="bg-green-50 border-b border-gray-300 p-2 flex gap-2">
                                <div class="h-6 w-6 bg-white border border-gray-300 rounded shadow-sm"></div>
                                <div class="h-6 w-24 bg-white border border-gray-300 rounded shadow-sm"></div>
                                <div class="flex-1 h-6 bg-white border border-gray-300 rounded shadow-sm px-2 text-xs flex items-center text-gray-500 font-mono">
                                    fx: ${fxText}
                                </div>
                            </div>
                            <!-- Table -->
                            <div class="overflow-x-auto">
                                <table class="w-full border-collapse text-sm">
                                    <thead>${tableHeaderHtml}</thead>
                                    <tbody>${tableBodyHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="lg:col-span-1 flex flex-col gap-4">
                        <div class="bg-white rounded-xl shadow-sm p-6 flex-1">
                            <h3 class="font-bold text-gray-500 uppercase text-xs mb-4 tracking-wider">Варіанти відповіді</h3>
                            <div class="space-y-3">
                                ${optionsHtml}
                            </div>
                        </div>
                        ${feedbackHtml}
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        // --- Логіка (Controller) ---

        function startGame() {
            state.score = 0;
            state.currentLevelIndex = 0;
            state.screen = 'playing';
            state.selectedOptionId = null;
            state.isCorrect = false;
            render();
        }

        function handleOptionClick(optionId) {
            const level = levels[state.currentLevelIndex];
            const correct = optionId === level.correctOptionId;
            
            state.selectedOptionId = optionId;
            state.isCorrect = correct;
            
            if (correct) {
                state.score++;
            }
            
            state.screen = 'feedback';
            render();
        }

        function nextLevel() {
            if (state.currentLevelIndex < levels.length - 1) {
                state.currentLevelIndex++;
                state.screen = 'playing';
                state.selectedOptionId = null;
                state.isCorrect = false;
            } else {
                state.screen = 'finished';
            }
            render();
        }

        // Запуск
        render();

    </script>
</body>
</html>
